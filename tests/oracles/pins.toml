expected = { "url" = "https://downloads.haskell.org/~ghcup/0.2.6.2/x86_64-linux-ghcup-0.2.6.2", "sha256" = "9ed5da5449b48043a0d17e767c05d2ef585e25a639bb934329496c6d2fad9cf8" }

