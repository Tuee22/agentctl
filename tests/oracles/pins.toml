# Independent contract: decisions D-18 to D-20 and the published 0.2.6.2 SHA256SUMS.
# Source: https://downloads.haskell.org/~ghcup/0.2.6.2/SHA256SUMS
# These literals precede bootstrap implementation; no value comes from agentctl.

[[case]]
id = "pins.toolchain.versions"
requirement = "R4"
quote = "b) installs cabal"
provenance = "decision:D-20"
input = { "subject" = "toolchain-pins" }
expected = { "ghc" = "9.12.4", "cabal" = "3.16.1.0" }

[[case]]
id = "pins.ghcup.download-version"
requirement = "R3"
quote = "idempotently installs ghcup in the manner appropriate for the OS in question"
provenance = "decision:D-19"
input = { "subject" = "ghcup-download-version" }
expected = "0.2.6.2"

[[case]]
id = "pins.ghcup.reuse-floor"
