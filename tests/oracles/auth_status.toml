[[case]]
id = "auth.warning.claude.logged-out"
requirement = "R13"
quote = "agentctl should instruct the user to do so themselves with the appropriate command (eg claude auth login)"
provenance = "decision:D-16"
input = { subject = "auth-warning", agent = "claude", outcome = 1 }
expected = { exit = 7, lines = ["agentctl: claude is not logged in, so no session was started.", "agentctl: log in yourself by typing: claude auth login"] }

[[case]]
