# Independent provisioning cases from toolchain_bootstrap.md and decisions D-18 to D-20.
# These cases isolate prerequisite-ready and warm hosts; consent cases extend the table.
# Non-warm domain: five platforms, five ghcup states, and the three incomplete pin combinations.
# Both answering pins use the warm rows: discovery and prerequisite probes are then unobserved.
# Actions carry ghcup arguments without its host-specific absolute executable path.
# The after facts are inputs for the separate idempotence assertion, not output from the subject.
# Refusals leave the same facts and must execute no action.

