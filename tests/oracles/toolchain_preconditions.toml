# Independent P7/P8/P10 boundary cases from quality_gate.md and toolchain_bootstrap.md.
# Budgets and observed capacity use arbitrary equal units; the policy compares their values.

[[case]]
id = "bootstrap.preconditions.equal-budget"
requirement = "R4"
quote = "b) installs cabal"
provenance = "decision:D-20"
input = { "family" = "Linux", "architecture" = "x86_64", "ghcup_free" = 10, "cache_free" = 10, "ghcup_required" = 10, "cache_required" = 10, "pins_ready" = false, "downloads_reachable" = true, "hackage_reachable" = true }
expected = []

[[case]]
id = "bootstrap.preconditions.ghcup-short"
requirement = "R4"
quote = "b) installs cabal"
provenance = "decision:D-20"
input = { "family" = "Linux", "architecture" = "x86_64", "ghcup_free" = 9, "cache_free" = 10, "ghcup_required" = 10, "cache_required" = 10, "pins_ready" = false, "downloads_reachable" = true, "hackage_reachable" = true }
expected = ["P7: free space in ghcup's directory and agentctl's cache for missing toolchain pins"]

