[[case]]
id = "protocol.handshake"
requirement = "R6"
quote = "the user shouldn't need to call the haskell binary directly"
provenance = "decision:D-52"
input = { line = '{"subject":"handshake"}' }
expected = { protocol = 1, commands = ["claude", "codex", "list", "status", "attach", "stop", "adopt", "watch", "unwatch", "pause", "resume-watch", "logs", "supervisor"] }

