expected = { target = "=left:%1" }

[[case]]
id = "mux.pane.selection.ambiguous"
requirement = "R7"
quote = "codex and claude are both commands"
provenance = "decision:D-85"
input = { subject = "mux-pane-selection", panes = ["=left:%1", "=right:%1"] }
expected = { error = "ambiguous pane id; use SESSION:%id" }

[[case]]
id = "mux.render.scoped.capture"
requirement = "R7"
quote = "codex and claude are both commands"
provenance = "decision:D-85"
input = { subject = "mux-render", family = "Windows", action = "capture", pane = "=api-codex:%1", lines = 100 }
expected = { executable = "psmux.exe", argv = ["capture-pane", "-p", "-J", "-t", "=api-codex:%1", "-S", "-100"] }

