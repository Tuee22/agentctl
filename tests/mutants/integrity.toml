[[mutant]]
id = "M-guard-parallel-runner-allowed"
operator = "short-circuit"
target = "src/agentctl/check/validator/source.py"
search = "def forbidden_surfaces(root: Path) -> tuple[str, ...]:\n    \"\"\"Keep check as the only workflow entry surface outside data fixtures.\"\"\"\n    names: tuple[str, ...] = ()\n    for current, directories, files in os.walk(root):\n        directory = Path(current)\n        directories[:] = [\n            name\n            for name in directories\n            if directory / name not in {root / \".git\", root / \"tests/fixtures\"}\n        ]\n        for name in files:\n            path = directory / name\n            relative = path.relative_to(root)\n            script = path.suffix in {\".sh\", \".ps1\", \".bat\", \".cmd\"} or (\n                path.suffix == \".py\" and relative.parts[0] not in {\"src\", \"tests\"}\n            )\n            if name in FORBIDDEN_NAMES or script:\n                names += (relative.as_posix(),)\n    directories = tuple(\n        path\n        for path in (\".github/workflows\", \".githooks\", \"hooks\", \"scripts\")\n        if (root / path).exists()\n    )\n    return tuple(\n        sorted(f\"tree.forbidden-surfaces: {name}\" for name in (*names, *directories))\n    ) + _script_entries(root)"
replace = "def forbidden_surfaces(root: Path) -> tuple[str, ...]:\n    \"\"\"Deliberately ignore workflow surfaces.\"\"\"\n    return ()"
killers = ["tests/governance/test_forbidden_surfaces.py::test_fixture_and_live_tree"]
reason = "parallel runner was accepted"

