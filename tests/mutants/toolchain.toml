search = "if before.value != after.value:"
replace = "if False:"
killers = ["tests/integration/test_toolchain.py::test_default_links_unchanged_by_step"]
reason = "default selection changes were ignored"

[[mutant]]
id = "M-boot-ghcup-on-warm-run"
