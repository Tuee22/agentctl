search = "numeric_version(path, context)"
replace = "numeric_version(\"ghc\", context)"
killers = ["tests/integration/test_toolchain.py::test_whereis_paths_used_verbatim"]
reason = "recorded tool paths were not used verbatim"

[[mutant]]
id = "M-boot-links-unchecked"
