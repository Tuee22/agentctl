[[mutant]]
id = "M-boot-spawn-adds-set"
operator = "replace-literal"
target = "src/agentctl/bootstrap/toolchain.py"
search = "(str(action.executable), *action.arguments),"
replace = "(str(action.executable), *action.arguments, \"--set\"),"
killers = ["tests/integration/test_toolchain.py::test_argv_never_sets"]
reason = "toolchain install argv changed default selection"

[[mutant]]
id = "M-boot-ghc-from-path"
operator = "replace-literal"
