[[mutant]]
id = "M-backoff-uncapped"
operator = "replace-literal"
target = "src/agentctl/haskell/src/AgentCtl/Recovery/Backoff.hs"
search = "cap settings = min (maximumDelay settings)"
replace = "cap _settings = id"
killers = ["tests/unit/test_backoff.py::test_delays_and_escalations_match_oracle", "haskell:agentctl-core-test/Backoff/grows-to-cap"]
reason = "backoff delay or escalation differs from oracle"

