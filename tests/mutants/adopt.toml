[[mutant]]
id = "M-adopt-stop-kills"
operator = "widen"
target = "src/agentctl/haskell/src/AgentCtl/Sessions.hs"
search = "stopCommand (Adopted _) = Nothing"
replace = "stopCommand (Adopted view) = Command.Kill <$> (Adopt.viewSessionName view >>= either (const Nothing) Just . Name.makeSessionName)"
killers = ["tests/unit/test_adopt_values.py::test_adopt_rows_match_oracle", "tests/e2e/test_adopt.py::test_adopt_does_not_take_ownership"]
reason = "adopted pane policy differs from ownership oracle"

