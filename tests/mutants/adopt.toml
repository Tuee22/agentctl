[[mutant]]
id = "M-adopt-sets-session-options"
operator = "widen"
target = "src/agentctl/haskell/src/AgentCtl/Sessions.hs"
search = "Adopt.Register entry -> saveRegistry runtime (currentRegistry ++ [entry])"
replace = '''Adopt.Register entry -> do
            saveRegistry runtime (currentRegistry ++ [entry])
            case current of
              Nothing -> pure ()
              Just observed -> case Name.makeSessionName (Adopt.observationSession observed) of
                Left _ -> pure ()
                Right name -> case Command.makeOptionValue "agentctl" of
                  Nothing -> pure ()
                  Just owner -> void (checkedCommand runtime (Command.SetIdentity name Command.Owner owner))'''
killers = ["tests/e2e/test_adopt.py::test_adopt_does_not_take_ownership"]
reason = "adopted pane policy differs from ownership oracle"
