[[mutant]]
id = "M-sessions-list-includes-foreign"
operator = "widen"
target = "src/agentctl/haskell/src/AgentCtl/Sessions.hs"
search = 'reportOwner report == Just "agentctl"'
replace = 'reportOwner report /= Just "foreign"'
killers = ["tests/unit/test_sessions_values.py::test_list_rows_match_oracle", "tests/e2e/test_sessions.py::test_list_shows_only_managed"]
reason = "session rows differ from ownership oracle"

[[mutant]]
id = "M-sessions-dead-as-alive"
operator = "replace-literal"
