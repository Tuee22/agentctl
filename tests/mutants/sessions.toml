search = "(paneDead pane)"
replace = "(paneDead pane && panePid pane == 0)"
killers = ["tests/unit/test_sessions_values.py::test_list_rows_match_oracle", "tests/e2e/test_sessions.py::test_status_reports_dead_pane"]
reason = "session rows differ from ownership oracle"

