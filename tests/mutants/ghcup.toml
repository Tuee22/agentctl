            verified = fetch(asset, staged)
            if isinstance(verified, Err):
                return verified
            if asset.family != "Windows":
                staged.chmod(0o755)'''
killers = ["tests/integration/test_ghcup.py::test_truncated_download_leaves_nothing"]
reason = "partial ghcup was published in place"

