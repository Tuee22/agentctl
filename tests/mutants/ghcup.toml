            if isinstance(verified, Err):
                return verified
            if asset.family != "Windows":
                staged.chmod(0o755)
            if destination.exists() or destination.is_symlink():
                return Err(
                    GhcupError("ghcup destination changed during download; retry")
                )
            staged.replace(destination)'''
