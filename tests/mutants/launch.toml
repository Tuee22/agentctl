replace = "Plan [CaptureOutput, ReportExit] status"
killers = ["tests/unit/test_launch_plan.py::test_launch_plan_matches_oracle"]
reason = "launch plan differs from oracle"

[[mutant]]
id = "M-launch-warn-into-pane"
operator = "replace-literal"
target = "src/agentctl/haskell/src/AgentCtl/Launch.hs"
search = "relay _ captured = io (Text.hPutStr stderr captured)"
