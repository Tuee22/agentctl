[[mutant]]
id = "M-auth-exit2-as-logged-out"
operator = "replace-literal"
target = "src/agentctl/haskell/src/AgentCtl/Agent/Auth.hs"
search = "classifyAuth (Exited _) = CheckFailed"
replace = "classifyAuth (Exited _) = LoggedOut"
killers = ["tests/unit/test_auth_status.py::test_classify_auth_matches_oracle"]
reason = "auth classification differs from oracle"

[[mutant]]
id = "M-auth-timeout-as-logged-in"
operator = "replace-literal"
target = "src/agentctl/haskell/src/AgentCtl/Agent/Auth.hs"
search = "classifyAuth ProbeTimeout = CheckFailed"
replace = "classifyAuth ProbeTimeout = LoggedIn"
killers = ["tests/unit/test_auth_status.py::test_classify_auth_matches_oracle"]
reason = "auth classification differs from oracle"

[[mutant]]
id = "M-auth-remedy-wrong-command"
