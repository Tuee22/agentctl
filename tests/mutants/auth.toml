[[mutant]]
id = "M-auth-probe-drops-env"
operator = "delete"
target = "src/agentctl/haskell/src/AgentCtl/Agent/Auth.hs"
search = "probeInvocation entry executable = Process.Invocation executable (authArguments entry)"
replace = "probeInvocation entry executable directory _ deadline = Process.Invocation executable (authArguments entry) directory [] deadline"
killers = ["tests/integration/test_agent_auth_probe.py::test_probe_sees_caller_environment"]
reason = "auth probe dropped caller environment"
