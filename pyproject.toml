[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "agentctl"
version = "0.1.0"
description = "Manage and supervise terminal coding agents"
requires-python = ">=3.12"
dependencies = ["click==8.5.0"]

[project.optional-dependencies]
dev = ["ruff==0.17.3", "ty==0.0.95", "pytest==9.2.0", "coverage==7.17.0", "hatchling==1.33.0"]

[project.scripts]
agentctl = "agentctl.cli:main"

[tool.hatch.build.targets.wheel.force-include]
"src/agentctl/resources/python-startup.pth" = "00_agentctl_no_bytecode.pth"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D203", "D213", "COM812"]

[tool.ruff.lint.per-file-ignores]
"src/agentctl/process.py" = ["S603", "S606"]
"tests/**/*.py" = ["S101"]
"src/agentctl/check/writeguard.py" = ["PTH115"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Any".msg = "Name the precise type."
"typing.cast".msg = "Parse into the type instead."
"typing.no_type_check".msg = "Every function is type checked."
"unittest.mock".msg = "Observe real effects instead."

[tool.ty.rules]
all = "error"

[tool.ty.analysis]
respect-type-ignore-comments = false

[tool.ty.terminal]
error-on-warning = true

[tool.pytest]
minversion = "9.0"
strict = true
filterwarnings = ["error"]
testpaths = ["tests"]
markers = ["evidence(cls): the evidence class: value, real or observer"]

[tool.coverage.run]
branch = true
source = ["agentctl"]
patch = ["subprocess"]

[tool.coverage.report]
fail_under = 100
